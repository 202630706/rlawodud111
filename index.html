<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>크롬 공룡 피하기 게임</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #1a1a1a;
            font-family: 'Arial', sans-serif;
            color: white;
            flex-direction: column;
            user-select: none;
        }

        #game-container {
            position: relative;
            width: 800px;
            height: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        canvas {
            background: linear-gradient(to bottom, #1e272e, #485460);
            border-bottom: 4px solid #d2dae2;
            display: block;
        }

        .score-board {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            text-align: right;
        }

        .new-record-text {
            color: #f1c40f;
            animation: glow 0.5s infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 5px #fff, 0 0 10px #f1c40f; }
            to { text-shadow: 0 0 20px #fff, 0 0 30px #e67e22; }
        }

        #effect-overlay {
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 40px;
            font-weight: 900;
            color: #f1c40f;
            text-shadow: 0 0 10px #000, 0 0 20px #f39c12;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
        }

        #effect-overlay.show {
            opacity: 1;
            transform: translate(-50%, -60%) scale(1.2);
        }

        .controls-info {
            margin-top: 15px;
            color: #aaa;
            font-size: 14px;
        }
        
        kbd {
            background-color: #333;
            border: 1px solid #555;
            border-radius: 3px;
            padding: 2px 6px;
            color: #fff;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div class="score-board">
            <div>HIGH: <span id="high-score">0</span></div>
            <div>SCORE: <span id="current-score">0</span></div>
            <div style="font-size: 14px; color: #f39c12;">SPEED: <span id="speed-display">6.0</span></div>
        </div>
        <div id="effect-overlay">🎉 NEW RECORD! 🎉</div>
        <canvas id="gameCanvas" width="800" height="400"></canvas>
    </div>

    <div class="controls-info">
        조작법: <kbd>Space</kbd> 점프 (연속 2회 눌러 2단점프) | <kbd>Shift</kbd> 숙이기 | 게임 오버 시 <kbd>Space</kbd> 재시작
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const scoreEl = document.getElementById('current-score');
        const highScoreEl = document.getElementById('high-score');
        const speedEl = document.getElementById('speed-display');
        const effectOverlay = document.getElementById('effect-overlay');

        let score = 0;
        let highScore = localStorage.getItem('runner_high_score') || 0;
        highScoreEl.textContent = highScore;

        let isGameOver = false;
        let isNewRecord = false;
        let scoreInterval;
        let gameLoopId;
        let frameCount = 0;

        const groundY = 360;

        // 티라노사우루스 캐릭터 설정
        const player = {
            x: 80,
            y: 300,
            normalWidth: 44,
            normalHeight: 60,
            duckWidth: 60,
            duckHeight: 30,
            width: 44,
            height: 60,
            color: '#2ed573',
            dy: 0,
            gravity: 0.65,
            jumpPower: -11.5,
            jumpCount: 0,       // 현재 점프 횟수 (최대 2회)
            maxJumps: 2,
            isDucking: false
        };

        let obstacles = [];
        const keys = {};

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ShiftLeft' || e.code === 'ShiftRight') {
                if (!keys[e.code]) { // 누르는 순간 처리 (점프 입력 중복 방지)
                    if (e.code === 'Space' && !isGameOver) {
                        handleJump();
                    }
                }
                keys[e.code] = true;
            }

            if (isGameOver && e.code === 'Space') {
                resetGame();
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.code === 'Space' || e.code === 'ShiftLeft' || e.code === 'ShiftRight') {
                keys[e.code] = false;
            }
        });

        // 점프 로직 (2단 점프 포함)
        function handleJump() {
            if (player.isDucking) return; // 숙인 상태에선 점프 불가

            if (player.jumpCount < player.maxJumps) {
                player.dy = player.jumpPower;
                player.jumpCount++;
            }
        }

        function resetGame() {
            score = 0;
            scoreEl.textContent = score;
            scoreEl.classList.remove('new-record-text');
            effectOverlay.classList.remove('show');
            
            isGameOver = false;
            isNewRecord = false;
            obstacles = [];
            frameCount = 0;

            player.y = groundY - player.normalHeight;
            player.dy = 0;
            player.width = player.normalWidth;
            player.height = player.normalHeight;
            player.jumpCount = 0;
            player.isDucking = false;

            clearInterval(scoreInterval);
            scoreInterval = setInterval(() => {
                if (!isGameOver) {
                    score++;
                    scoreEl.textContent = score;
                    checkHighScore();
                }
            }, 100);

            cancelAnimationFrame(gameLoopId);
            update();
        }

        function checkHighScore() {
            if (score > highScore) {
                highScore = score;
                highScoreEl.textContent = highScore;
                localStorage.setItem('runner_high_score', highScore);

                if (!isNewRecord && highScore > 0) {
                    isNewRecord = true;
                    scoreEl.classList.add('new-record-text');
                    effectOverlay.classList.add('show');
                    setTimeout(() => {
                        effectOverlay.classList.remove('show');
                    }, 2000);
                }
            }
        }

        // 장애물 생성 (선인장 최대 3개 / 익룡 무작위 높이)
        function spawnObstacle() {
            const type = Math.random() < 0.55 ? 'cactus' : 'pterodactyl';

            if (type === 'cactus') {
                // 선인장 1~3개 랜덤 연결 생성
                const cactusCount = Math.floor(Math.random() * 3) + 1;
                const singleWidth = 18;
                const height = 45 + Math.floor(Math.random() * 10);
                
                obstacles.push({
                    type: 'cactus',
                    x: canvas.width,
                    y: groundY - height,
                    width: singleWidth * cactusCount,
                    height: height,
                    count: cactusCount,
                    color: '#26de81'
                });
            } else {
                // 익룡 생성 (2단 점프 높이까지 차단하는 다양한 y 좌표)
                // y: 170 (최고 점프 지점 도달 높이 -> 숙이기 전용), 220 (중간 높이), 275 (저공 비행)
                const possibleY = [170, 220, 275];
                const selectedY = possibleY[Math.floor(Math.random() * possibleY.length)];
                
                obstacles.push({
                    type: 'pterodactyl',
                    x: canvas.width,
                    y: selectedY,
                    width: 46,
                    height: 32,
                    wingState: 0,
                    color: '#a55eea'
                });
            }
        }

        function update() {
            if (isGameOver) return;

            frameCount++;
            const currentSpeed = 6.0 + (score * 0.015);
            speedEl.textContent = currentSpeed.toFixed(1);

            // --- 1. 플레이어 상태 (숙이기 & 물리) ---
            if ((keys['ShiftLeft'] || keys['ShiftRight']) && player.jumpCount === 0) {
                player.isDucking = true;
                player.width = player.duckWidth;
                player.height = player.duckHeight;
                player.y = groundY - player.duckHeight;
            } else {
                if (player.isDucking) {
                    player.y -= (player.normalHeight - player.duckHeight);
                }
                player.isDucking = false;
                player.width = player.normalWidth;
                player.height = player.normalHeight;
            }

            player.dy += player.gravity;
            player.y += player.dy;

            // 바닥 착지
            const currentHeight = player.height;
            if (player.y + currentHeight >= groundY) {
                player.y = groundY - currentHeight;
                player.dy = 0;
                player.jumpCount = 0; // 점프 횟수 초기화
            }

            // --- 2. 장애물 관리 ---
            const spawnRate = Math.max(45, Math.floor(1050 / currentSpeed));
            if (frameCount % spawnRate === 0) {
                spawnObstacle();
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.x -= currentSpeed;

                // 익룡 날개 애니메이션
                if (obs.type === 'pterodactyl' && frameCount % 15 === 0) {
                    obs.wingState = obs.wingState === 0 ? 1 : 0;
                }

                if (obs.x + obs.width < 0) {
                    obstacles.splice(i, 1);
                    continue;
                }

                // 충돌 검사 (히트박스 정밀 조정)
                const padding = 4;
                if (
                    player.x + padding < obs.x + obs.width &&
                    player.x + player.width - padding > obs.x &&
                    player.y + padding < obs.y + obs.height &&
                    player.y + player.height - padding > obs.y
                ) {
                    gameOver();
                }
            }

            draw();
            gameLoopId = requestAnimationFrame(update);
        }

        // --- 🎨 픽셀 스타일 렌더링 함수들 ---

        // 티라노사우루스 그리기
        function drawTyranno(x, y, isDucking) {
            ctx.fillStyle = player.color;
            if (!isDucking) {
                // 몸통 & 머리
                ctx.fillRect(x + 10, y + 15, 24, 30); // 몸
                ctx.fillRect(x + 20, y, 20, 18);    // 머리
                ctx.fillRect(x + 32, y + 8, 12, 10);  // 주둥이
                ctx.fillRect(x, y + 25, 12, 10);     // 꼬리
                // 다리
                ctx.fillRect(x + 12, y + 45, 8, 15);
                ctx.fillRect(x + 26, y + 45, 8, 15);
                // 눈
                ctx.fillStyle = '#1e272e';
                ctx.fillRect(x + 30, y + 4, 4, 4);
            } else {
                // 숙인 상태 (길고 낮게)
                ctx.fillRect(x + 10, y + 8, 38, 18);  // 몸통
                ctx.fillRect(x + 40, y + 4, 18, 14);  // 머리
                ctx.fillRect(x, y + 12, 12, 8);      // 꼬리
                // 짧은 다리
                ctx.fillRect(x + 18, y + 24, 8, 6);
                ctx.fillRect(x + 32, y + 24, 8, 6);
                // 눈
                ctx.fillStyle = '#1e272e';
                ctx.fillRect(x + 48, y + 6, 4, 4);
            }
        }

        // 선인장 그리기 (1~3개)
        function drawCactus(obs) {
            ctx.fillStyle = obs.color;
            const singleW = obs.width / obs.count;
            
            for (let i = 0; i < obs.count; i++) {
                const cx = obs.x + (i * singleW);
                const cy = obs.y;
                const cw = singleW - 2;
                
                // 줄기
                ctx.fillRect(cx + 4, cy, cw - 8, obs.height);
                // 가지
                ctx.fillRect(cx, cy + 12, cw, 6);
                ctx.fillRect(cx, cy + 6, 4, 6);
                ctx.fillRect(cx + cw - 4, cy + 6, 4, 6);
            }
        }

        // 익룡 그리기
        function drawPterodactyl(obs) {
            ctx.fillStyle = obs.color;
            const x = obs.x;
            const y = obs.y;

            // 몸통 및 부리
            ctx.fillRect(x + 12, y + 12, 22, 10); // 몸
            ctx.fillRect(x + 30, y + 8, 16, 6);   // 부리
            ctx.fillRect(x, y + 14, 12, 4);      // 꼬리

            // 날개 애니메이션 (위/아래)
            if (obs.wingState === 0) {
                // 날개 위로
                ctx.beginPath();
                ctx.moveTo(x + 18, y + 12);
                ctx.lineTo(x + 10, y);
                ctx.lineTo(x + 28, y + 12);
                ctx.fill();
            } else {
                // 날개 아래로
                ctx.beginPath();
                ctx.moveTo(x + 18, y + 18);
                ctx.lineTo(x + 10, y + 30);
                ctx.lineTo(x + 28, y + 18);
                ctx.fill();
            }

            // 눈
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(x + 32, y + 9, 3, 3);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 바닥
            ctx.fillStyle = '#d2dae2';
            ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

            // 최고기록 반짝임 효과
            if (isNewRecord) {
                ctx.fillStyle = 'rgba(241, 196, 15, 0.08)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            // 플레이어
            drawTyranno(player.x, player.y, player.isDucking);

            // 장애물
            for (const obs of obstacles) {
                if (obs.type === 'cactus') {
                    drawCactus(obs);
                } else if (obs.type === 'pterodactyl') {
                    drawPterodactyl(obs);
                }
            }
        }

        function gameOver() {
            isGameOver = true;
            clearInterval(scoreInterval);

            ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#ff4757';
            ctx.font = 'bold 48px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 20);

            ctx.fillStyle = '#ffffff';
            ctx.font = '20px Arial';
            ctx.fillText('스페이스바(Space)를 눌러 다시 시작', canvas.width / 2, canvas.height / 2 + 30);
        }

        resetGame();
    </script>
</body>
</html>
